name: Portões de qualidade e publicação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validação de qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
      - name: Configurar o pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - name: Configurar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Configurar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar as dependências Python
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar as dependências Node.js
        run: pnpm install --frozen-lockfile
      - name: Verificar os tipos
        run: pnpm typecheck
      - name: Verificar a qualidade do código
        run: pnpm lint
      - name: Executar os testes unitários
        run: pnpm test
      - name: Validar a geração de dados
        run: python src/generate_data.py
      - name: Validar a consultoria de lacunas
        run: python src/consultant_gap_finder.py
      - name: Validar o consultor de IA
        run: python src/ai_consultant.py
      - name: Validar a qualidade dos dados
        run: python src/data_quality.py
      - name: Validar os relatórios
        run: python src/reports.py
      - name: Compilar os módulos Python
        run: python -m compileall src app
      - name: Executar os testes Python
        run: python -m pytest
      - name: Gerar a aplicação estática
        run: pnpm build
      - name: Instalar o navegador de testes
        run: pnpm exec playwright install --with-deps chromium
      - name: Executar os testes de ponta a ponta
        run: pnpm test:e2e:prod

  deploy:
    name: Publicação no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
      - name: Configurar o pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - name: Configurar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar as dependências
        run: pnpm install --frozen-lockfile
      - name: Gerar a aplicação estática
        run: pnpm build
        env:
          DEPLOY_TARGET: github-pages
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar o artefato de publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
